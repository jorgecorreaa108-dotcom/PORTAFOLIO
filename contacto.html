<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <nav class="mt-3 d-flex gap-2 flex-wrap justify-content-end" aria-label="Navegación principal">
            <a href="index.html" class="btn btn-primary">INICIO</a>
            <a href="snacks.html" class="btn btn-primary">SNACKS</a>
            <a href="comida.html" class="btn btn-primary">COMIDA</a>
            <a href="contacto.html" class="btn btn-primary">CONTACTO</a>
        </nav>
        <h1>CONTACTO</h1>
        <img src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&amp;fit=crop&amp;w=200&amp;h=200&amp;q=80" class="d-block mx-auto rounded-circle mt-3 mb-3" alt="Personas colaborando para representar contacto" width="100" height="100" style="object-fit: cover; max-width: 100px;">
        <form class="mt-4 mx-auto" method="post" style="max-width: 540px;">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="name" required>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label for="comentarios" class="form-label">Comentarios</label>
                <textarea class="form-control" id="comentarios" name="comentarios" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        <table class="table table-bordered table-striped mt-3" style="width: 300px;">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Calif Real</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Portales</td>
                    <td>x</td>
                </tr>
                <tr>
                    <td>Orientación</td>
                    <td>8</td>
                </tr>
                <tr>
                    <td>Entornos</td>
                    <td>6</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
